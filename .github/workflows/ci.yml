name: CI/CD

# Run on every push and pull request to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  docker:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t my-first-devops-project:${{ github.sha }} .

      - name: Smoke-test the container
        run: |
          docker run -d --name app -p 8080:8080 my-first-devops-project:${{ github.sha }}
          # Give the app a moment to start, then hit /health
          for i in $(seq 1 10); do
            if curl -fs http://localhost:8080/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed" && docker logs app && exit 1

  publish:
    name: Publish image to GHCR
    needs: docker
    runs-on: ubuntu-latest
    # Only publish from pushes to main — never from pull requests or other branches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tag with both the exact commit SHA (immutable) and 'latest' (moving pointer)
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
